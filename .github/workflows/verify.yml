name: verify release

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m archaeal_dbd.cli audit
      - run: python -m archaeal_dbd.smoke
      - run: python scripts/audit_references.py manuscript/Revised_archaeal_DBD_manuscript.docx
      - run: MPLCONFIGDIR=/tmp/matplotlib python -m archaeal_dbd.cli all --output-dir /tmp/archaeal-dbd-generated
      - run: sha256sum -c MANIFEST.sha256
